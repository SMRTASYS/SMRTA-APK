name: Build SMRTA.APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Prepare Android SDK & Gradle 8.9 Wrapper
        run: |
          set -e
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          echo "[DEBUG] SDK_DIR=$SDK_DIR"
          java -version

          SDKMANAGER=""
          for candidate in \
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_DIR/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK_DIR/cmdline-tools/11.0/bin/sdkmanager" \
            "$SDK_DIR/tools/bin/sdkmanager"
          do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_DIR" -name sdkmanager -type f -executable 2>/dev/null | head -n 1 || true)"
          fi

          echo "[DEBUG] SDKMANAGER=${SDKMANAGER:-NOT_FOUND}"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || \
            "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          fi

          if command -v gradle >/dev/null 2>&1; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          elif [ -f "./gradlew" ]; then
            sed -i 's/gradle-[0-9.]*-bin\.zip/gradle-8.9-bin.zip/g' gradle/wrapper/gradle-wrapper.properties || true
          fi
          chmod +x ./gradlew
          echo "[DEBUG] Wrapper siap:"
          grep "distributionUrl" gradle/wrapper/gradle-wrapper.properties || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMRTA-APK-debug
          path: app/build/outputs/apk/debug/*.apk
